<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1">
	    <title>Clients List</title>
	    <!-- Bootstrap CSS -->
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
	    <!-- Bootstrap Icons -->
	    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Clients List</h1>
            </div>
            <div class="card-body">
                <a th:href="@{/clients/new}" class="btn btn-success mb-3">
                    <i class="bi bi-plus-circle"></i> Add New Client
                </a>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prenom</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="client : ${clients}">
                                <td th:text="${client.id}"></td>
                                <td th:text="${client.nom}"></td>
                                <td th:text="${client.prenom}"></td>
                                <td>
                                    <a th:href="@{/clients/edit/{id}(id=${client.id})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
									<a href="#" class="btn btn-sm btn-danger" 
									   th:attr="data-id=${client.id}" 
									   onclick="confirmDelete(this)">
									    <i class="bi bi-trash"></i> Delete
									</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <a th:href="@{/comptes}" class="btn btn-secondary mt-3">
                    <i class="bi bi-credit-card"></i> View Comptes
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
	<script>
	    function confirmDelete(element) {
	        const clientId = element.getAttribute('data-id');
	        Swal.fire({
	            title: 'Are you sure?',
	            text: 'This action cannot be undone!',
	            icon: 'warning',
	            showCancelButton: true,
	            confirmButtonColor: '#d33',
	            cancelButtonColor: '#3085d6',
	            confirmButtonText: 'Yes, delete it!'
	        }).then((result) => {
	            if (result.isConfirmed) {
	                // Redirect to delete URL
	                window.location.href = `/clients/delete/${clientId}`;
	            }
	        });
	    }
	</script>
</body>
</html>
