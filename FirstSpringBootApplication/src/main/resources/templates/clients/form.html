<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${client.id} ? 'Edit Client' : 'Add Client'">Client Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0" th:text="${client.id} ? 'Edit Client' : 'Add Client'">Client Form</h1>
                    </div>
                    <div class="card-body">
                        <!-- Make sure the form action points to /clients/save -->
                        <form th:action="@{/clients/save}" th:object="${client}" method="post">
                            <input type="hidden" th:field="*{id}"/>
                            
                            <div class="mb-3">
                                <label class="form-label">Nom:</label>
                                <input type="text" class="form-control" th:field="*{nom}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Prenom:</label>
                                <input type="text" class="form-control" th:field="*{prenom}" required>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-primary me-md-2">
                                    Save
                                </button>
                                <a th:href="@{/clients}" class="btn btn-secondary">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
