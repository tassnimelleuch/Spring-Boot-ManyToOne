<!-- src/main/resources/templates/edit-compte.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${compte.rib} ? 'Edit Compte' : 'Add Compte'">Compte Form</title>
</head>
<body>
    <h1 th:text="${compte.rib} ? 'Edit Compte' : 'Add Compte'">Compte Form</h1>
    <form th:action="@{/comptes/save}" method="post">
        <input type="hidden" name="rib" th:value="${compte.rib}"/>
        <div>
            <label>Solde:</label>
            <input type="number" step="0.01" name="solde" th:value="${compte.solde}" required/>
        </div>
        <div>
            <label>Client:</label>
            <select name="clientId" required>
                <option value="">Select Client</option>
                <option th:each="client : ${clients}"
                        th:value="${client.id}"
                        th:text="${client.nom + ' ' + client.prenom}"
                        th:selected="${compte.client != null && compte.client.id == client.id}">
                </option>
            </select>
        </div>
        <button type="submit">Save</button>
    </form>
    <a th:href="@{/comptes}">Back to List</a>
</body>
</html>
