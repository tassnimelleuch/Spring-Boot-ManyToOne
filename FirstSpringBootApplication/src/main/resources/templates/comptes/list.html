<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Accounts List</h1>
            </div>
            <div class="card-body">
                <a th:href="@{/comptes/new}" class="btn btn-success mb-3">
                    <i class="bi bi-plus-circle"></i> Add New Account
                </a>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>RIB</th>
                                <th>Balance</th>
                                <th>Client</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="compte : ${comptes}">
                                <td th:text="${compte.id}"></td>
                                <td th:text="${compte.rib}"></td>
                                <td th:text="${compte.solde}"></td>
                                <td th:text="${compte.client.nom + ' ' + compte.client.prenom}"></td>
                                <td>
                                    <a th:href="@{/comptes/edit/{id}(id=${compte.id})}" 
                                       class="btn btn-sm btn-primary me-2">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
									<a href="#" class="btn btn-sm btn-danger" 
									   th:data-id="${compte.id}" 
									   onclick="confirmDelete(this)">
									   <i class="bi bi-trash"></i> Delete
									</a>
									</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-3">
                    <a th:href="@{/clients}" class="btn btn-secondary">
                        <i class="bi bi-people"></i> View Clients
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

	<script>
		function confirmDelete(element) {
		    const id = element.getAttribute('data-id');
		    console.log("Attempting to delete ID:", id); // Debug line
		    Swal.fire({
		        title: 'Confirm Deletion',
		        text: "You won't be able to revert this!",
		        icon: 'warning',
		        showCancelButton: true,
		        confirmButtonColor: '#d33',
		        cancelButtonColor: '#3085d6',
		        confirmButtonText: 'Delete'
			 }).then((result) => {
			        if (result.isConfirmed) {
						window.location.href = `/comptes/delete/${id}`;

			        }
			    });
			}
	</script>
</body>
</html>
