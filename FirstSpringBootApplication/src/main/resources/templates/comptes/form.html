<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0" th:text="${compte.id} ? 'Edit Account' : 'Add Account'">Account Form</h1>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/comptes/save}" method="post">
                            <input type="hidden" th:field="*{compte.id}"/>
                            
                            <div class="mb-3">
                                <label class="form-label">RIB:</label>
                                <input type="text" class="form-control" th:field="*{compte.rib}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Solde:</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{compte.solde}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Client:</label>
                                <select class="form-select" name="clientId" required>
                                    <option value="">Select a client</option>
                                    <option th:each="client : ${clients}"
                                            th:value="${client.id}"
                                            th:text="${client.nom + ' ' + client.prenom}"
                                            th:selected="${compte.client != null && compte.client.id == client.id}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-primary me-md-2">Save</button>
                                <a th:href="@{/comptes}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
